<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./style.css" />
    <title>Memory Game</title>
  </head>
  <body>
    <div>
      <div class="container">
        <h1>memory</h1>
        <div class="start-box">
          <div>
            <label for="" style="font-size: 20px; color: #7191a5"
              >Select Theme</label
            >
            <div class="theme">
              <button data-group="theme" id="numbers">Numbers</button>
              <button data-group="theme" id="icons">Icons</button>
            </div>
          </div>

          <div>
            <label for="" style="font-size: 20px; color: #7191a5"
              >Numbers of Players</label
            >
            <div class="players">
              <button data-group="players" id="players-1">1</button>
              <button data-group="players" id="players-2">2</button>
              <button data-group="players" id="players-3">3</button>
              <button data-group="players" id="players-4">4</button>
            </div>
          </div>

          <div>
            <label for="" style="font-size: 20px; color: #7191a5"
              >Grid Size</label
            >
            <div class="grid-size">
              <button data-group="gridSize" id="grid-size-4">4x4</button>
              <button data-group="gridSize" id="grid-size-6">6x6</button>
            </div>
          </div>

          <button id="submit" class="submit">Start Game</button>
          <script src="./app.js" type="module"></script>
        </div>
      </div>
    </div>
  </body>
</html>
