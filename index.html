<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./style.css" />
    <title>Memory Game</title>
  </head>
  <body>
    <div>
      <div class="container">
        <h1>memory</h1>
        <div class="start-box">
          <div>
            <label for="" style="font-size: 20px; color: #7191a5"
              >Select Theme</label
            >
            <div class="theme">
              <button>Numbers</button>
              <button>Icons</button>
            </div>
          </div>

          <div>
            <label for="" style="font-size: 20px; color: #7191a5"
              >Numbers of Players</label
            >
            <div class="theme">
              <button>1</button>
              <button>2</button>
              <button>3</button>
              <button>4</button>
            </div>
          </div>

          <div>
            <label for="" style="font-size: 20px; color: #7191a5"
              >Grid Size</label
            >
            <div class="theme">
              <button>4x4</button>
              <button>6x6</button>
            </div>
          </div>

          <button class="submit">Start Game</button>
        </div>
      </div>
    </div>
  </body>
</html>
