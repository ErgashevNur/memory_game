<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./gameZone.css" />
    <title>Memory Game</title>
  </head>
  <body>
    <div class="container">
      <div class="navigation">
        <div>
          <h1>memory</h1>
        </div>

        <div class="buttonsBox">
          <button class="restart">Restart</button>
          <button id="newGame" class="newGame">New Game</button>
        </div>
      </div>

      <div class="gameZone"></div>

      <div class="footerSection">
        <div class="player1">
          <div class="timeBox">
            <span>Time</span>
            <span>1:30</span>
          </div>

          <div class="movesBox">
            <span>Moves</span>
            <span>39</span>
          </div>
        </div>

        <div class="morePlayers"></div>
      </div>
      <script src="./gameZone.js"></script>
    </div>
  </body>
</html>
